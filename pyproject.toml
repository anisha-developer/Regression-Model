[project]
name = "premiumiq-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
# Minimal runtime deps for Vercel (no uvicorn/mangum — platform runs ASGI)
dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.4",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.6.0",
    "joblib==1.4.2",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.uv]
package = false
managed = true
python-preference = "only-managed"
