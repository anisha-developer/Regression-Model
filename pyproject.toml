[project]
name = "premiumiq-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scikit-learn==1.6.0",
    "joblib==1.4.2",
    "python-multipart==0.0.20",
    "mangum==0.19.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.uv]
package = false
managed = true
python-preference = "only-managed"
